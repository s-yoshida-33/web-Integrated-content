<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AEON EVENTNEWS - XML (aeon.jp format, Portrait 1080x1920 / Landscape 1920x1080)</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    'use strict';
    // 縦横は解像度のアスペクト比で自動判定できるが、層間(1920x540)は配信ソフト上の
    // 解像度が横型と同じ1920x1080になるため、このロジックだけでは判定できない
    // (層間はCMS側の対応が確認できるまで別テンプレート(strip-1920x540)のまま運用する)。
    function applyOrientation() {
      var portrait = window.innerWidth < window.innerHeight;
      document.documentElement.classList.toggle('layout-portrait', portrait);
      document.documentElement.classList.toggle('layout-landscape', !portrait);
    }
    applyOrientation();
    window.addEventListener('resize', applyOrientation);
    // iframeの文書解析開始時点(<head>実行時)ではまだ親側のiframeサイズ確定前の値
    // (ブラウザのデフォルトiframeサイズ=横長)を読んでしまうことがあるため、
    // レイアウト確定後のDOMContentLoaded時にも再判定する
    document.addEventListener('DOMContentLoaded', applyOrientation);
  })();
</script>
</head>
<body>
  <div id="ws-root">
    <div class="container container-header" data-container="header">
      <span class="header-logo inline-svg" data-src="assets/tpl/AEON_MALL_logo.svg"></span>
      <div class="header-clock-group">
        <span class="header-clock-icon inline-svg" data-src="assets/tpl/current_time.svg"></span>
        <span class="header-clock" id="header-clock"></span>
      </div>
    </div>
    <div class="container container-side" data-container="side">
      <svg class="side-label" viewBox="0 0 120 1800">
        <text x="60" y="900" transform="rotate(90 60 900)" text-anchor="middle" dominant-baseline="central"
          font-family="Inter" font-weight="900" font-size="96" letter-spacing="9.6"
          fill="#FFFFFF" stroke="#FF7700" stroke-width="12" paint-order="stroke fill">EVENT NEWS</text>
      </svg>
    </div>
    <div class="container container-eventlabel" data-container="eventlabel">
      <svg class="eventlabel-svg" viewBox="0 0 960 120">
        <text x="480" y="60" text-anchor="middle" dominant-baseline="central"
          font-family="Inter" font-weight="900" font-size="96" letter-spacing="9.6"
          fill="#FFFFFF" stroke="#FF7700" stroke-width="12" paint-order="stroke fill">EVENT NEWS</text>
      </svg>
    </div>
    <div class="container container-image" data-container="image">
      <img class="event-photo" id="event-photo" alt="">
    </div>
    <div class="container container-body" data-container="body">
      <h1 class="event-title" id="event-title"></h1>
      <p class="event-body" id="event-body"></p>
    </div>
    <div class="container container-footer" data-container="footer">
      <div class="footer-info">
        <div class="footer-text-area" id="footer-date-row">
          <span class="footer-icon inline-svg" data-src="assets/tpl/date.svg"></span>
          <span class="footer-text" id="event-date"></span>
        </div>
        <div class="footer-text-area" id="footer-time-row">
          <span class="footer-icon inline-svg" data-src="assets/tpl/time.svg"></span>
          <span class="footer-text" id="event-time"></span>
        </div>
        <div class="footer-text-area" id="footer-venues-row">
          <span class="footer-icon inline-svg" data-src="assets/tpl/location.svg"></span>
          <span class="footer-text" id="event-venues"></span>
        </div>
        <span class="footer-qr-label" id="footer-qr-label">詳しくはWEBで</span>
        <img class="footer-qr" id="footer-qr" alt="">
      </div>
    </div>
  </div>
  <!-- aeon.jp形式(<eventroot>/<event>、本文・写真が<contents>の入れ子)のXML用。レイアウト・デザインは
       responsive/と共通で、データの読み方のみ異なる(template.js の CONFIG.fieldPaths 参照)。
       image/body/footer コンテナは <contents>/<photos>/<photo>/<img_path> / <title> / <contents>/<body> /
       <date> / <time> / <place> に接続し、WEB QRはCMSが<pc_url>から生成するqr-map.json(eventId→QR画像パス)を利用する。
       縦横の出し分けはresponsive/と同じく、head内スクリプトが画面サイズから判定する(style.css参照)。 -->
  <script src="template.js"></script>
</body>
</html>
