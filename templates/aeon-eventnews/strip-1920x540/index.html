<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>AEON EVENTNEWS - Strip 1920x540</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ws-root">
    <div class="container container-header" data-container="header">
      <span class="header-logo inline-svg" data-src="assets/tpl/AEON_MALL_logo.svg"></span>
      <div class="header-clock-group">
        <span class="header-clock-icon inline-svg" data-src="assets/tpl/current_time.svg"></span>
        <span class="header-clock" id="header-clock"></span>
      </div>
    </div>
    <div class="container container-image" data-container="image">
      <img class="event-photo" id="event-photo" alt="">
    </div>
    <div class="container container-eventlabel" data-container="eventlabel">
      <svg class="eventlabel-svg" viewBox="0 0 1470 68">
        <text x="735" y="34" text-anchor="middle" dominant-baseline="central"
          font-family="Inter" font-weight="900" font-size="50" letter-spacing="5"
          fill="#FFFFFF" stroke="#FF7700" stroke-width="6.25" paint-order="stroke fill">EVENT NEWS</text>
      </svg>
    </div>
    <div class="container container-body" data-container="body">
      <h1 class="event-title" id="event-title"></h1>
      <p class="event-body" id="event-body"></p>
    </div>
    <div class="container container-footer" data-container="footer">
      <div class="footer-info">
        <div class="footer-text-area" id="footer-date-row">
          <span class="footer-icon inline-svg" data-src="assets/tpl/date.svg"></span>
          <span class="footer-text" id="event-date"></span>
        </div>
        <div class="footer-text-area" id="footer-time-row">
          <span class="footer-icon inline-svg" data-src="assets/tpl/time.svg"></span>
          <span class="footer-text" id="event-time"></span>
        </div>
        <div class="footer-text-area" id="footer-venues-row">
          <span class="footer-icon inline-svg" data-src="assets/tpl/location.svg"></span>
          <span class="footer-text" id="event-venues"></span>
        </div>
        <span class="footer-qr-label" id="footer-qr-label">詳しくはWEBで</span>
        <img class="footer-qr" id="footer-qr" alt="">
      </div>
    </div>
  </div>
  <!-- ヘッダー(ロゴ・現在時刻)のみ接続済み。他コンテナ実装時に対象フィールドと
       複数レコードのローテーションを拡張する -->
  <script src="template.js"></script>
</body>
</html>
